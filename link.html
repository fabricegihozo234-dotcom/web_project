<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        .alex{

            background-color: azure;
            text-align: center;
            color: darkgreen;
            border-radius: 10px;
            margin-top: -20px;
            text-transform: uppercase;
            font-size: medium;
        }
        .link{
            background-color: burlywood;
            height: 40px;
            margin-top: -20px;
            border-radius: 10px;
            
        }
        .link ul{

            display: flex;
            
        }
        .link ul li{
          margin-top: -10px;
            list-style-type: none;
            padding: 20px;
            margin-left: 17px;
        }
         .link ul li a{
            text-decoration: none;
            color: gold;
            
         }
         .link ul li a:hover{
            background-color: brown;
            border-radius: 10px;
         }
         .middle{
            
            height: 200px;
            display: flex;
            border-radius: 10px;
            background-color: cyan;

            
 
         }
         .paragraph{
            
            background-color: cadetblue;
            width: 550px;
            padding-left: 200px;
            margin-left:50px ;

         }
         .paragraph p{
            font-size: 10px;
            
         }
         .picture{
           
            padding-left: 200px;
            background-color: aqua;
            width: 500px;
            margin-right:  100px;
           
            
         }
    </style>
</head>

<body>
   <div class="alex">

    <h1>iot monitoring system</h1>


   </div> 
   <div class="link">
<ul>
    <li><a href="">home</a></li>
    <li><a href="">login</a></li>
    <li><a href="">register</a></li>
    <li><a href="">about us</a></li>
</ul>


   </div>
   <div class="middle">
<div class="paragraph">
<p>candide is more beautiful</p>

</div>
<div class="picture">
<img src="tomato_small.png" style="width: 10px;
margin-left: 70px;
margin-top: 40px;
height: 10px;

">

</div>


   </div>
</body>
</html>
