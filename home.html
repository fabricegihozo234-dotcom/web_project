<body>
    <h1>login form</h1>

    <div class="session1">
<h4>login form</h4>
<h2 id="w">names:<input type="text" name="first" placeholder=
"enter your first name"></h2><br>

<h2 id="e">home_a:<input type="text" name="address" placeholder=
"enter your home address"></h2><br>


<h2 id="r">phone_no:<input type="number" name="no" placeholder=
"enter your phone no"></h2><br>


<h2 id="r">Password: <input type="password" id="userPass" placeholder="enter password"></h2>

<p id="error-msg" style="color: red; text-align: center;"></p>

<button id="loginBtn" class="button"><a href="index.html">log in</a></button>




    </div>

    <script>
    const loginButton = document.getElementById('loginBtn');
    const errorDisplay = document.getElementById('error-msg');

    loginButton.addEventListener('click', function(event) {
        // 1. Get the value the user typed
        const typedPassword = document.getElementById('userPass').value;
        const correctPassword = "12345"; // You decide this

        // 2. Check if it matches
        if (typedPassword === "") {
            event.preventDefault(); // Stop the page from changing
            errorDisplay.innerText = "Please enter a password.";
        } 
        else if (typedPassword !== correctPassword) {
            event.preventDefault(); // Stop the page from changing
            errorDisplay.innerText = "Incorrect password! Try again.";
            
            // Optional: shake the input or clear it
            document.getElementById('userPass').value = ""; 
        } 
        else {
            // If it's correct, we do nothing and let the <a href> work!
            alert("Login Successful!");
        }
    });
</script>
